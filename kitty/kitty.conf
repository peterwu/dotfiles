# fonts
font_family      family='SF Mono' postscript_name=SFMono-Regular
bold_font        family='SF Mono' postscript_name=SFMono-Bold
italic_font      family='SF Mono' postscript_name=SFMono-RegularItalic
bold_italic_font family='SF Mono' postscript_name=SFMono-BoldItalic

disable_ligatures         always
font_size                 16

# cursor
cursor_shape block

# key binds
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# mouse
copy_on_select        yes
default_pointer_shape arrow
detect_urls           yes
mouse_hide_wait       -1

# clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# shell integration
shell_integration no-cursor no-title no-cwd no-sudo

# window layout
confirm_os_window_close 0
enabled_layouts         tall
window_padding_width    5

# advanced
update_check_interval 0

# macOS specific tweaks
macos_colorspace                   displayp3
macos_option_as_alt                yes
macos_quit_when_last_window_closed no
macos_show_window_title_in         none
macos_thicken_font                 0.19
macos_titlebar_color               background

# wayland
wayland_titlebar_color             background

# tab bar
active_tab_font_style     bold
active_tab_title_template ":{index}"
tab_title_template        ".{index}"

